apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: mission-control
  namespace: argocd
  annotations: { argocd.argoproj.io/sync-wave: "1" }
  finalizers: [resources-finalizer.argocd.argoproj.io]
spec:
  project: ares
  source:
    repoURL: https://github.com/bharathnani708/ares-aiops
    targetRevision: main
    path: charts/ares-service
    helm:
      releaseName: mission-control
      valueFiles: [../../gitops/values/mission-control.yaml]
  destination: { server: https://kubernetes.default.svc, namespace: ares }
  syncPolicy:
    automated: { prune: true, selfHeal: true }   # drift is reverted automatically
    retry: { limit: 10, backoff: { duration: 15s, factor: 2, maxDuration: 3m } }
