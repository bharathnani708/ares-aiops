# habitat-api: the workload under observation.
image:
  repository: 032265100995.dkr.ecr.us-east-1.amazonaws.com/ares-aiops/habitat-api
  tag: "initial"   # CI replaces this with the git SHA of each build

replicaCount: 2

secretEnv:
  CHAOS_TOKEN: { secretName: ares-chaos-token, key: token }

serviceMonitor:
  enabled: true

networkPolicy:
  allowFrom:
    - podSelector:
        matchLabels: { app.kubernetes.io/name: mission-control }
    - namespaceSelector:
        matchLabels: { kubernetes.io/metadata.name: monitoring }
