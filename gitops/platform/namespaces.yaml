# Pod Security Admission "restricted" for app namespaces.
apiVersion: v1
kind: Namespace
metadata:
  name: ares
  labels:
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/warn: restricted
---
apiVersion: v1
kind: Namespace
metadata:
  name: logging
  labels:
    pod-security.kubernetes.io/enforce: privileged   # Fluent Bit reads host log files
---
# Default-deny ingress for the app namespace; each chart opens what it needs.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: ares
spec:
  podSelector: {}
  policyTypes: [Ingress]
