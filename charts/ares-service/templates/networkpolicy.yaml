{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "ares.name" . }}
  labels: {{- include "ares.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels: {{- include "ares.selector" . | nindent 6 }}
  policyTypes: [Ingress]
  ingress:
    - ports:
        - port: {{ .Values.containerPort }}
          protocol: TCP
      {{- with .Values.networkPolicy.allowFrom }}
      from: {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
