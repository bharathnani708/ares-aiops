{{- range .Values.rbac.roles }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "ares.name" $ }}-read
  namespace: {{ .namespace }}
  labels: {{- include "ares.labels" $ | nindent 4 }}
rules: {{- toYaml .rules | nindent 2 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "ares.name" $ }}-read
  namespace: {{ .namespace }}
  labels: {{- include "ares.labels" $ | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "ares.name" $ }}-read
subjects:
  - kind: ServiceAccount
    name: {{ include "ares.sa" $ }}
    namespace: {{ $.Release.Namespace }}
{{- end }}
